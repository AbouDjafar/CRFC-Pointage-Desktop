<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/crfc_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRFC Pointage Desktop</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(135deg, #1e3a5f 0%, #2a5298 100%);
      }

      body.boot-ready #boot-splash {
        opacity: 0;
        visibility: hidden;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(135deg, #1e3a5f 0%, #2a5298 100%);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      .boot-circle {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        animation: boot-breathe 6s ease-in-out infinite;
      }

      .boot-circle.one {
        width: 520px;
        height: 520px;
        right: -180px;
        bottom: -180px;
      }

      .boot-circle.two {
        width: 320px;
        height: 320px;
        left: -120px;
        top: -120px;
        animation-delay: 0.8s;
      }

      .boot-panel {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 16px;
        color: #fff;
      }

      .boot-logo {
        width: 124px;
        height: 124px;
        padding: 20px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      }

      .boot-logo img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .boot-brand {
        font-family: Georgia, serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 8px;
      }

      .boot-subtitle {
        font-size: 13px;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.74);
      }

      .boot-progress {
        width: 170px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      .boot-progress-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #f97316, #fbbf24);
        transform-origin: left center;
        animation: boot-progress 1.8s ease-in-out infinite;
      }

      .boot-label {
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.42);
      }

      @keyframes boot-breathe {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }

      @keyframes boot-progress {
        0% { transform: scaleX(0.1); opacity: 0.7; }
        50% { transform: scaleX(0.86); opacity: 1; }
        100% { transform: scaleX(0.18); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-circle one"></div>
      <div class="boot-circle two"></div>
      <div class="boot-panel">
        <div class="boot-logo">
          <img src="/assets/crfc_logo.svg" alt="CRFC" />
        </div>
        <div class="boot-brand">CRFC</div>
        <div class="boot-subtitle">Pointage Desktop</div>
        <div class="boot-progress">
          <div class="boot-progress-fill"></div>
        </div>
        <div class="boot-label">Initialisation</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
