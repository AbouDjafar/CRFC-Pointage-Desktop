[package]
name = "crfc-pointage-desktop"
version = "0.1.0"
edition = "2021"

[package.metadata.tauri-winres]
InternalName = "crfc-pointage-desktop"
OriginalFilename = "crfc-pointage-desktop.exe"
FileDescription = "CRFC Pointage Desktop"
ProductName = "CRFC Pointage Desktop"
LegalCopyright = "Copyright (c) 2026 CRFC. Tous droits reserves."

[lib]
name = "crfc_pointage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
